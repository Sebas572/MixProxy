services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    volumes:
      - ./certs:/mixproxy/certs
      - ./config:/mixproxy/config
      - ./logs:/mixproxy/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./containers.template.json:/mixproxy/containers.template.json
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
    networks:
      - mixproxy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin_panel
    volumes:
      - ./config:/config
      - ./logs:/logs
    restart: unless-stopped
    networks:
      - mixproxy

  redis:
   image: redis:latest
   ports:
     - 6379:6379
   restart: unless-stopped
   environment:
     - REDIS_PASSWORD=mixproxy123
   networks:
     - mixproxy

networks:
  mixproxy:
    external: true
    driver: bridge